    <style>
      .sans { font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .ink { fill: #173044; }
      .muted { fill: #5d7383; }
      .blue { fill: #1683a3; }
      .red { fill: #d53b36; }
      .orange { fill: #d38a24; }
      .green { fill: #348b68; }
      .card { fill: #ffffff; stroke: #c9dae4; stroke-width: 2; }
      .line { stroke: #c9dae4; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#f5fafc"/>

    <text x="302" y="95" font-size="23" font-weight="800" letter-spacing="3" class="ink">TIRT</text>
    <text x="92" y="152" font-size="52" font-weight="800" class="ink">Runnable scene library</text>
    <text x="94" y="190" font-size="20" class="muted">Thermal infrared directional radiative transfer · choose one surface and one vegetation type</text>

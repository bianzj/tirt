        <path d="M47 140l113-38M96 159l112-38M145 176l112-38M194 158l113-38" stroke="#f7d18b" stroke-width="6" stroke-linecap="round"/>
        <path d="M61 136l-8-34M82 143l-8-34M112 153l-8-34M133 160l-8-34M163 170l-8-34M184 163l-8-34M214 153l-8-34M235 146l-8-34M265 136l-8-34" stroke="#348b68" stroke-width="6" stroke-linecap="round"/>

        <path d="M80 143V84M80 84l-25-25M80 98l29-28M168 172V93M168 101l-32-28M168 117l37-31M250 145V75M250 84l-30-28M250 99l38-31" stroke="#725a45" stroke-width="9" stroke-linecap="round"/>
        <circle cx="54" cy="59" r="31" fill="#348b68"/><circle cx="103" cy="70" r="29" fill="#4d9872"/><circle cx="137" cy="92" r="31" fill="#348b68"/>
        <circle cx="139" cy="68" r="29" fill="#69aa78"/><circle cx="197" cy="74" r="31" fill="#348b68"/><circle cx="238" cy="57" r="30" fill="#4d9872"/><circle cx="285" cy="73" r="31" fill="#348b68"/>

appId: cn.tirt.desktop
productName: TiRT
copyright: Copyright © TIRTLab. PolyForm Noncommercial License 1.0.0
asar: true
electronDist: node_modules/electron/dist
electronLanguages:
  - zh-CN
  - en-US
directories:
  output: release/v${version}
files:
  - desktop/**/*
  - "!desktop/installer.nsh"
  - package.json
  - tirt.ico
# Built by scripts/build_installer.py into build/installer/.
extraResources:
  - from: build/installer/backend/TiRT-service
    to: backend
  - from: tirt.ico
    to: tirt.ico
extraFiles:
  - from: build/installer/docs
    to: docs
  - from: build/installer/source
    to: .
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: TiRT-Setup-${version}-x64.${ext}
  icon: tirt.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TiRT
  deleteAppDataOnUninstall: false
  installerIcon: tirt.ico
  uninstallerIcon: tirt.ico
  license: build/installer/LICENSE.txt
  include: desktop/installer.nsh
